name: Ember CI

on:
  push:
  pull_request:

jobs:
  rust-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --workspace --all-targets
      - name: Cargo test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Architecture validation
        run: cargo run -p ember_validation --bin ember_validate -- architecture .
      - name: Certification vertical slice
        run: cargo test -p ember_tools --test certification
      - name: Build editor
        run: cargo build -p ember_editor
      - name: Build runtime host
        run: cargo build -p ember_runtime_host
